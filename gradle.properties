# Build settings. Keep this file free of machine-specific paths:
# JAVA_HOME is picked up by tools/_env.ps1 and local.properties holds sdk.dir
# (written by tools/bootstrap-sdk.ps1).

org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
